<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港最高气温 · 概率预报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0E8;
  --paper-2:#EAE6DB;
  --card:#FBFAF6;
  --ink:#1A1C1E;
  --ink-2:#55585C;
  --ink-3:#8C8E8F;
  --rule:#1A1C1E1F;
  --rule-2:#1A1C1E0F;
  --hot:#C8431E;
  --cold:#2F5D8A;
  --pos:#2E7D4F;
  --neg:#B0322A;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Noto Serif SC','Songti SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{max-width:1040px;margin:0 auto;padding:0 32px 64px}

/* 报头 */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:40px 0 18px;border-bottom:2px solid var(--ink)}
.masthead .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.masthead h1{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.02em;margin-top:6px}
.masthead .meta{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.7}
.subhead{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2)}

/* 日期与运行 */
.controls{display:flex;align-items:stretch;gap:0;margin-top:28px;border:1px solid var(--rule);background:var(--card)}
.date-bar{display:flex;flex:1;overflow-x:auto}
.date-chip{flex:1;min-width:150px;padding:14px 18px;cursor:pointer;border-right:1px solid var(--rule);position:relative;transition:background .15s}
.date-chip:hover{background:var(--paper)}
.date-chip.active{background:var(--ink);color:var(--paper)}
.date-chip .day{font-weight:600;font-size:15px}
.date-chip .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:3px}
.date-chip.active .meta{color:#ffffff99}
.skeleton{flex:1;min-width:150px;height:66px;border-right:1px solid var(--rule);background:linear-gradient(90deg,var(--card),var(--paper-2),var(--card));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.run-btn{flex:none;border:none;background:var(--hot);color:#fff;font:600 15px/1 inherit;font-family:inherit;padding:0 30px;cursor:pointer;display:flex;align-items:center;gap:10px;letter-spacing:.04em}
.run-btn:hover{background:#B13A18}
.run-btn:disabled{background:var(--ink-3);cursor:not-allowed}
.run-btn .spin{width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 运行记录 */
.steps{margin-top:20px;font-family:var(--mono);font-size:13px}
.step{display:grid;grid-template-columns:34px 260px 1fr;gap:12px;padding:7px 0;border-bottom:1px dashed var(--rule);opacity:0;animation:in .25s forwards}
@keyframes in{to{opacity:1}}
.step .no{color:var(--ink-3)}
.step .lab{color:var(--ink)}
.step .det{color:var(--ink-2)}
.step.error .lab,.step.error .no{color:var(--neg)}
.step.warn .no{color:var(--hot)}
.step.skip .lab{color:var(--ink-3)}

/* 结果 */
.results{display:none;margin-top:40px}
.results.show{display:block;animation:in .4s forwards}
.sec{margin-top:44px}
.sec-title{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:16px}
.sec-title h2{font-family:var(--serif);font-size:19px;font-weight:700}
.sec-title span{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em}

.lead{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:end}
.lead .big{font-family:var(--mono);font-size:112px;line-height:.9;font-weight:500;letter-spacing:-.04em;color:var(--hot)}
.lead .big small{font-size:44px;letter-spacing:0;margin-left:4px;color:var(--ink)}
.lead .cap{margin-top:14px;font-size:15px;color:var(--ink-2)}
.lead .cap b{color:var(--ink);font-family:var(--mono);font-weight:600}
.facts{border-top:1px solid var(--rule)}
.fact{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.fact .k{color:var(--ink-2)}
.fact .v{font-family:var(--mono);font-weight:500}
.fact .v em{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:8px;font-size:12px}
.flag{font-family:var(--mono);font-size:12px;padding:1px 7px;border:1px solid currentColor;border-radius:3px}

/* 档位分布 */
.hist{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:240px;padding-top:24px;border-bottom:1px solid var(--ink)}
.bin{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bin .bar{width:100%;background:var(--paper-2);border-top:2px solid var(--ink-3);position:relative}
.bin.top .bar{background:#C8431E26;border-top-color:var(--hot)}
.bin .mk{position:absolute;left:-3px;right:-3px;height:0;border-top:2px dashed var(--cold)}
.bin .p{position:absolute;top:-20px;font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.bin.top .p{color:var(--hot);font-weight:600}
.axis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-family:var(--mono);font-size:12px;text-align:center;padding-top:6px;color:var(--ink-2)}
.legend{display:flex;gap:22px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:10px;margin-right:6px;vertical-align:-1px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink-3);text-align:right;padding:6px 10px;border-bottom:1px solid var(--ink);text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--card)}
td.pos{color:var(--pos);font-weight:600}td.neg{color:var(--neg)}
.sig{font-family:inherit;font-size:12px;padding:2px 8px;border-radius:3px}
.sig-买入{background:var(--pos);color:#fff}
.sig-观望{border:1px solid var(--hot);color:var(--hot)}
.sig-跳过{color:var(--ink-3)}

/* 交易方案 */
.plan{border:1px solid var(--rule);background:var(--card)}
.plan-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.plan-head b{font-size:15px}
.plan-head .urg{font-size:13px;color:var(--hot);font-weight:600}
.tl{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.tl>div{padding:12px 18px;border-right:1px solid var(--rule)}
.tl>div:last-child{border-right:none}
.tl .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.tl .v{font-size:14px;margin-top:2px}
.cap-row{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.capital-input{width:90px;font-family:var(--mono);font-size:15px;padding:5px 8px;border:1px solid var(--rule);background:#fff;color:var(--ink);outline:none}
.capital-input:focus{border-color:var(--ink)}
.capital-summary{margin-left:auto;font-family:var(--mono);font-size:13px}
.plan table td,.plan table th{padding-left:18px;padding-right:18px}
.plan-sum{display:grid;grid-template-columns:repeat(3,1fr)}
.plan-sum>div{padding:14px 18px;border-right:1px solid var(--rule)}
.plan-sum>div:last-child{border-right:none}
.plan-sum .k{font-size:12px;color:var(--ink-3)}
.plan-sum .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px}

.chart-wrap svg{width:100%;height:auto;display:block}
.note{padding:12px 16px;border-left:3px solid var(--hot);background:var(--card);font-size:14px;color:var(--ink-2)}
footer{max-width:1040px;margin:0 auto;padding:18px 32px 40px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:760px){
  .shell{padding:0 16px 48px}
  .masthead{flex-direction:column;align-items:flex-start}.masthead .meta{text-align:left}
  .controls{flex-direction:column}.run-btn{padding:16px;justify-content:center}
  .step{grid-template-columns:28px 1fr}.step .det{grid-column:2}
  .lead{grid-template-columns:1fr;gap:20px}.lead .big{font-size:84px}
  .tl,.plan-sum{grid-template-columns:1fr}.tl>div,.plan-sum>div{border-right:none;border-bottom:1px solid var(--rule)}
  .table-wrap{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <div class="kicker">HK Daily Max · Ensemble Forecast</div>
      <h1>香港最高气温 · 概率预报</h1>
    </div>
    <div class="meta" id="mastMeta">JMA 35% · ECMWF 30% · GFS 20% · 历史 15%<br>天文台实测 · 卡尔曼修正</div>
  </header>
  <div class="subhead"><span>选择日期，运行一次集合预报，再和 Polymarket 档位价格对照。</span><span class="mono" id="nowTime"></span></div>

  <div class="controls">
    <div class="date-bar" id="dateBar">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <button class="run-btn" id="runBtn" onclick="runAnalysis()" disabled>运行预报</button>
  </div>

  <div class="steps" id="stepLog"></div>

  <div class="results" id="resultsPanel"><div id="resultsContent"></div></div>
</div>

<footer>
  <span>数据：香港天文台 · Open-Meteo（JMA / ECMWF / GFS）· Polymarket</span>
  <span>预测仅供参考，不构成投资建议</span>
</footer>

<script>
let selectedDate = null, allDates = [], allMarkets = [], isRunning = false, _lastData = null;
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const clean = s => String(s || '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️]/gu, '').trim();

(function clock(){ const t = new Date(); document.getElementById('nowTime').textContent = t.toLocaleString('zh-HK', { hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) + ' HKT'; setTimeout(clock, 30000); })();

(async function init() {
  try {
    const res = await fetch('/api/dates');
    const data = await res.json();
    allDates = data.dates || [];
    allMarkets = data.markets || [];
    renderDateBar();
  } catch (e) {
    document.getElementById('dateBar').innerHTML = `<div class="note" style="flex:1">加载日期失败：${e.message}</div>`;
  }
})();

function renderDateBar() {
  const bar = document.getElementById('dateBar');
  if (!allDates.length) {
    const today = new Date().toISOString().slice(0, 10);
    allDates = [{ date: today, label: '今天', confidence: '中', market_count: 0, days_away: 0 }];
  }
  bar.innerHTML = allDates.map((d, i) => `
    <div class="date-chip ${i === 0 ? 'active' : ''}" data-date="${d.date}" onclick="selectDate('${d.date}', this)">
      <div class="day">${d.label}</div>
      <div class="meta">置信 ${d.confidence} · ${d.market_count > 0 ? d.market_count + ' 个档位市场' : '纯预报'}</div>
    </div>`).join('');
  selectedDate = allDates[0].date;
  document.getElementById('runBtn').disabled = false;
}

function selectDate(date, el) {
  if (isRunning) return;
  selectedDate = date;
  document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

async function runAnalysis() {
  if (isRunning || !selectedDate) return;
  isRunning = true;
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>运行中';
  const log = document.getElementById('stepLog');
  log.innerHTML = '';
  document.getElementById('resultsPanel').classList.remove('show');
  try {
    const res = await fetch(`/api/predict?date=${selectedDate}`);
    const data = await res.json();
    const steps = data.steps || [];
    for (let i = 0; i < steps.length; i++) {
      await new Promise(r => setTimeout(r, 160));
      const s = steps[i];
      const el = document.createElement('div');
      el.className = 'step ' + (s.status || '');
      el.innerHTML = `<span class="no">${String(i + 1).padStart(2, '0')}</span><span class="lab">${clean(s.label)}</span><span class="det">${clean(s.detail)}</span>`;
      log.appendChild(el);
    }
    await new Promise(r => setTimeout(r, 200));
    renderResults(data);
  } catch (e) {
    const el = document.createElement('div');
    el.className = 'step error';
    el.innerHTML = `<span class="no">!!</span><span class="lab">运行失败</span><span class="det">${e.message}</span>`;
    log.appendChild(el);
  }
  isRunning = false;
  btn.disabled = false;
  btn.textContent = '重新运行';
}

function title(h, en) { return `<div class="sec-title"><h2>${h}</h2><span>${en}</span></div>`; }

function renderResults(d) {
  _lastData = d;
  const f = d.forecasts || {};
  const probs = d.probabilities || {};
  const edges = d.edges || {};
  const mc = d.model_consistency || {};
  const strat = d.strategy || {};
  const topB = d.top_bucket, topP = d.top_prob || 0;
  let h = '';

  let hint = '';
  if (d.is_today && d.current_hour != null) {
    hint = d.current_hour < 8 ? '清晨，模型为主，建议 9 点后再看' : d.current_hour < 11 ? '已有实测，未到峰值' : d.current_hour < 14 ? '接近峰值，实测权重最高' : '峰值已过，基本锁定';
  } else if (d.days_away === 1) hint = '明天，预报可信度较高';
  else if (d.days_away > 1) hint = `${d.days_away} 天后，不确定性随距离上升`;

  const agree = mc.level ? `${mc.level}<em>相差 ${(mc.spread || 0).toFixed(1)}°C</em>` : '—';
  h += `<div class="sec">${title('预报结论', 'SUMMARY')}
    <div class="lead">
      <div>
        <div class="big">${topB}<small>°C</small></div>
        <div class="cap">最可能的最高气温档位，概率 <b>${pct(topP)}</b>。${hint}。</div>
      </div>
      <div class="facts">
        <div class="fact"><span class="k">JMA 日本 · 35%</span><span class="v">${f.jma ? f.jma.max + '°C' : '—'}</span></div>
        <div class="fact"><span class="k">ECMWF 欧洲 · 30%</span><span class="v">${f.ecmwf ? f.ecmwf.max + '°C' : '—'}</span></div>
        <div class="fact"><span class="k">GFS 美国 · 20%</span><span class="v">${f.gfs ? f.gfs.mean + '°C' : '—'}${f.gfs ? `<em>±${f.gfs.std} · ${f.gfs.members} 成员</em>` : ''}</span></div>
        <div class="fact"><span class="k">天文台实测</span><span class="v">${d.hko && d.hko.hko_temp != null ? d.hko.hko_temp + '°C' : '—'}${d.kalman_gain > 0 ? `<em>K = ${d.kalman_gain.toFixed(2)}</em>` : ''}</span></div>
        <div class="fact"><span class="k">置信度</span><span class="v">${d.confidence_label || '—'}<em>${d.confidence != null ? pct(d.confidence, 0) : ''}</em></span></div>
        <div class="fact"><span class="k">模型一致性</span><span class="v">${agree}</span></div>
      </div>
    </div></div>`;

  const market = {};
  Object.values(edges).forEach(e => { market[e.bucket] = e.market_prob; });
  const bins = Object.entries(probs).filter(([, p]) => p >= 0.005).map(([b, p]) => [+b, p]).sort((a, b) => a[0] - b[0]);
  const maxP = Math.max(...bins.map(x => x[1]), ...Object.values(market), 0.01);
  h += `<div class="sec">${title('各档位概率', 'DISTRIBUTION')}
    <div class="hist">${bins.map(([b, p]) => `<div class="bin ${b == topB ? 'top' : ''}">
        <div class="bar" style="height:${(p / maxP) * 92}%"><span class="p" style="left:50%;transform:translateX(-50%)">${pct(p, 0)}</span></div>
        ${market[b] != null ? `<div class="mk" style="bottom:${(market[b] / maxP) * 92}%"></div>` : ''}
      </div>`).join('')}</div>
    <div class="axis">${bins.map(([b]) => `<span>${b}°</span>`).join('')}</div>
    <div class="legend"><span><i style="background:#C8431E26;border-top:2px solid var(--hot)"></i>模型概率</span>${Object.keys(market).length ? '<span><i style="border-top:2px dashed var(--cold);height:0"></i>Polymarket 价格</span>' : ''}</div>
  </div>`;

  const edgeArr = Object.values(edges).sort((a, b) => b.edge - a.edge);
  h += `<div class="sec">${title('对照市场价格', 'EDGE vs POLYMARKET')}`;
  if (edgeArr.length) {
    h += `<div class="table-wrap"><table><thead><tr><th>档位</th><th>模型概率</th><th>市场价</th><th>差值</th><th>流动性</th><th>Kelly</th><th>信号</th></tr></thead><tbody>`;
    edgeArr.forEach(e => {
      h += `<tr><td>${e.bucket}°C</td><td>${pct(e.our_prob)}</td><td>${pct(e.market_prob)}</td>
        <td class="${e.edge >= 0 ? 'pos' : 'neg'}">${e.edge >= 0 ? '+' : ''}${pct(e.edge)}</td>
        <td>${e.liq_level || '—'}</td><td>${pct(e.kelly)}</td><td><span class="sig sig-${e.signal}">${e.signal}</span></td></tr>`;
    });
    h += `</tbody></table></div>`;
  } else {
    h += `<div class="note">这一天暂时没有对应的 Polymarket 市场。</div>`;
  }
  h += `</div>`;

  const recs = strat.recommendations || [];
  if (recs.length) {
    h += `<div class="sec">${title('波段交易方案', 'STRATEGY B')}
      <div class="plan">
        <div class="plan-head"><b>交易计划</b><span class="urg">${clean(strat.urgency)}</span></div>
        <div class="tl">
          <div><div class="k">入场</div><div class="v">${strat.entry_window || '—'}</div></div>
          <div><div class="k">持仓</div><div class="v">等待天文台实测</div></div>
          <div><div class="k">出场</div><div class="v">${strat.exit_window || '—'}</div></div>
        </div>
        <div class="cap-row">本金 $<input type="number" class="capital-input" id="capitalInput" value="${strat.capital || 10}" min="1" max="10000" oninput="recalcPositions()">
          <span class="capital-summary" id="capitalSummary">投入 $${(strat.total_position || 0).toFixed(2)} / $${strat.capital || 10}</span></div>
        <div class="table-wrap"><table><thead><tr><th>档位</th><th>模型</th><th>买入价</th><th>仓位</th><th>止盈</th><th>止损</th><th>风报比</th><th>期望</th></tr></thead>
          <tbody id="recGrid">${recs.map(buildRecRow).join('')}</tbody></table></div>
        <div class="plan-sum">
          <div><div class="k">总投入</div><div class="v" id="sumPosition">$${(strat.total_position || 0).toFixed(2)}</div></div>
          <div><div class="k">最大亏损</div><div class="v" style="color:var(--neg)" id="sumRisk">-$${Math.abs(strat.total_risk || 0).toFixed(2)}</div></div>
          <div><div class="k">期望收益</div><div class="v" id="sumExpected">${money(strat.total_expected || 0)}</div></div>
        </div>
      </div>
      ${!strat.liquidity_ok ? `<div class="note" style="margin-top:12px">这一天总流动性 $${strat.total_liquidity || 0}，偏低，仓位要控制。</div>` : ''}
    </div>`;
  } else if (edgeArr.some(e => e.signal === '观望')) {
    h += `<div class="sec"><div class="note">没有差值超过 8% 的档位，先观望。</div></div>`;
  }

  if (f.jma && f.jma.hourly && f.ecmwf && f.ecmwf.hourly) {
    h += `<div class="sec">${title('逐时气温', 'HOURLY')}<div class="chart-wrap">${buildChart(f.jma.hourly, f.ecmwf.hourly, d.hko)}</div></div>`;
  }

  document.getElementById('resultsContent').innerHTML = h;
  document.getElementById('resultsPanel').classList.add('show');
}

function money(v) { return (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2); }

function buildRecRow(r) {
  return `<tr><td>${r.bucket}°C</td><td>${r.our_prob ? pct(r.our_prob, 0) : '—'}</td><td>${(r.entry_price * 100).toFixed(0)}¢</td>
    <td>${r.shares} 股 · $${r.position_amt.toFixed(2)}</td><td class="pos">${(r.take_profit * 100).toFixed(0)}¢</td>
    <td class="neg">${(r.stop_loss * 100).toFixed(0)}¢</td><td>${r.risk_reward}</td><td class="${r.expected_profit >= 0 ? 'pos' : 'neg'}">${money(r.expected_profit)}</td></tr>`;
}

function recalcPositions() {
  if (!_lastData || !_lastData.strategy) return;
  const cap = parseFloat(document.getElementById('capitalInput').value) || 10;
  const recs = _lastData.strategy.recommendations || [];
  const ratio = cap / (_lastData.strategy.capital || 10);
  let tp = 0, tr = 0, te = 0;
  const rows = recs.map(r => {
    const n = { ...r, position_amt: Math.max(0.5, +(r.position_amt * ratio).toFixed(2)), shares: Math.max(1, Math.round(r.shares * ratio)), max_loss: +(r.max_loss * ratio).toFixed(2), expected_profit: +(r.expected_profit * ratio).toFixed(2) };
    tp += n.position_amt; tr += n.max_loss; te += n.expected_profit;
    return buildRecRow(n);
  }).join('');
  const g = document.getElementById('recGrid'); if (g) g.innerHTML = rows;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('sumPosition', `$${tp.toFixed(2)}`);
  set('sumRisk', `-$${Math.abs(tr).toFixed(2)}`);
  set('sumExpected', money(te));
  set('capitalSummary', `投入 $${tp.toFixed(2)} / $${cap}`);
}

function buildChart(jma, ecmwf, hko) {
  const len = Math.min(jma.length, ecmwf.length, 24);
  const all = [...jma.slice(0, len), ...ecmwf.slice(0, len)].filter(v => v != null);
  if (!all.length) return '';
  const mn = Math.floor(Math.min(...all)) - 1, mx = Math.ceil(Math.max(...all)) + 1, rng = mx - mn || 1;
  const W = 960, H = 200, L = 36, T = 16;
  const px = i => L + (i + .5) * ((W - L) / len), py = v => T + H - ((v - mn) / rng) * H;
  let s = `<svg viewBox="0 0 ${W} ${H + T + 30}" font-family="IBM Plex Mono, monospace">`;
  for (let t = mn; t <= mx; t++) {
    s += `<line x1="${L}" y1="${py(t)}" x2="${W}" y2="${py(t)}" stroke="#1A1C1E" stroke-opacity="${t === mn ? .5 : .08}"/>`;
    s += `<text x="${L - 8}" y="${py(t) + 4}" font-size="11" fill="#8C8E8F" text-anchor="end">${t}°</text>`;
  }
  for (let i = 0; i < len; i += 3) s += `<text x="${px(i)}" y="${T + H + 22}" font-size="11" fill="#8C8E8F" text-anchor="middle">${String(i).padStart(2, '0')}:00</text>`;
  const path = arr => arr.slice(0, len).map((v, i) => v == null ? '' : `${i ? 'L' : 'M'}${px(i)},${py(v)}`).join('');
  s += `<path d="${path(jma)}" fill="none" stroke="#C8431E" stroke-width="2"/>`;
  s += `<path d="${path(ecmwf)}" fill="none" stroke="#2F5D8A" stroke-width="2" stroke-dasharray="5 4"/>`;
  if (hko && hko.hko_temp != null) {
    const hr = new Date().getHours();
    if (hr < len) s += `<circle cx="${px(hr)}" cy="${py(hko.hko_temp)}" r="5" fill="#1A1C1E"/><text x="${px(hr) + 10}" y="${py(hko.hko_temp) + 4}" font-size="12" fill="#1A1C1E">${hko.hko_temp}° 实测</text>`;
  }
  s += `<g font-size="12"><line x1="${W - 230}" y1="8" x2="${W - 206}" y2="8" stroke="#C8431E" stroke-width="2"/><text x="${W - 200}" y="12" fill="#55585C">JMA</text>
    <line x1="${W - 150}" y1="8" x2="${W - 126}" y2="8" stroke="#2F5D8A" stroke-width="2" stroke-dasharray="5 4"/><text x="${W - 120}" y="12" fill="#55585C">ECMWF</text>
    <circle cx="${W - 50}" cy="8" r="4" fill="#1A1C1E"/><text x="${W - 40}" y="12" fill="#55585C">实测</text></g>`;
  return s + '</svg>';
}
